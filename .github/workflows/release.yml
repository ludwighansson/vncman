# Publishes a GitHub release with GoReleaser when a version tag is pushed
# (ADR 0010). To release: git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags:
      - "v*"

# GoReleaser creates the release with the token GitHub Actions provides for
# each run, so no secret needs to be added.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits; the comment gives the version.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from the git history
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: false # a release shouldn't build from a shared cache

      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
